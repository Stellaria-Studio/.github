<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Stellaria Studio</title>
  <desc id="desc">Dream. Build. Become. Stellaria Compute and Stellaria Worlds constellation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset="0.55" stop-color="#080b16"/>
      <stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.46" r="0.6">
      <stop offset="0" stop-color="#6f91ff" stop-opacity=".20"/>
      <stop offset=".42" stop-color="#5d74ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#5d74ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ab2ff"/>
      <stop offset=".5" stop-color="#d6ddff"/>
      <stop offset="1" stop-color="#9ccaff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <circle cx="1010" cy="70" r="105" fill="#607cff" opacity=".06" filter="url(#blur)"/>
  <circle cx="820" cy="295" r="120" fill="#7eb7ff" opacity=".05" filter="url(#blur)"/>

  <g opacity=".08" stroke="#aab7e7" stroke-width="1">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

