      <text x="1018" y="128" text-anchor="middle" fill="#7f8aa3" font-size="11">VLA · AGENT</text>

      <circle cx="1037" cy="193" r="7" fill="#b5c5ff"/><circle cx="1037" cy="193" r="16" fill="none" stroke="#6f88d8" opacity=".4"/>
      <text x="1080" y="189" fill="#eef2ff" font-size="15" font-weight="700">Veyra</text>
      <text x="1080" y="208" fill="#7f8aa3" font-size="11">VISUAL</text>

      <circle cx="957" cy="285" r="7" fill="#b5c5ff"/><circle cx="957" cy="285" r="16" fill="none" stroke="#6f88d8" opacity=".4"/>
      <text x="957" y="323" text-anchor="middle" fill="#eef2ff" font-size="15" font-weight="700">Auralis</text>
      <text x="957" y="341" text-anchor="middle" fill="#7f8aa3" font-size="11">AUDIO</text>

